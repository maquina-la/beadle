name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Build universal app
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          VERSION="${VERSION#v}" UNIVERSAL=1 scripts/build-app.sh

      - name: Create checksum
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          VERSION="${VERSION#v}"
          shasum -a 256 "dist/beadle-${VERSION}.zip" > "dist/beadle-${VERSION}.zip.sha256"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          VERSION_NUMBER="${VERSION#v}"
          gh release create "$VERSION" \
            "dist/beadle-${VERSION_NUMBER}.zip" \
            "dist/beadle-${VERSION_NUMBER}.zip.sha256" \
            --generate-notes \
            --verify-tag
